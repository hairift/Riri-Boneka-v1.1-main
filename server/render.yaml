# Penerapan server Riri ke Render.com.
#
# Cara pakai:
#   1. Unggah folder server/ ini ke repositori GitHub Anda.
#   2. Di Render.com pilih New -> Blueprint lalu arahkan ke repositori tersebut.
#   3. Isi YOUTUBE_API_KEY dan RIRI_SECRET_KEY pada Environment Variables.
#   4. Salin URL layanan ke CONFIG_RIRI_SERVER_URL di firmware.
services:
  - type: web
    name: riri-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Paket gratis Render menyediakan 512 MB memori. Model embedding dan
    # pemeringkat ulang yang dipakai sengaja dipilih yang ringan agar muat.
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: RIRI_SECRET_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_REGION
        value: ID
      - key: REQUIRE_AUTH
        value: "true"
      - key: CACHE_TTL_SEARCH
        value: "600"
      - key: REDIS_URL
        fromService:
          type: redis
          name: riri-redis
          property: connectionString

  - type: redis
    name: riri-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
